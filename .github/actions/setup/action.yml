name: Set up the build
description: JDK, Gradle and the Kotlin/Native toolchain cache.

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 21

    - uses: gradle/actions/setup-gradle@v4

    # Kotlin/Native downloads its compiler and the iOS dependencies into ~/.konan on first use.
    - name: Cache Kotlin/Native
      if: runner.os == 'macOS'
      uses: actions/cache@v4
      with:
        path: ~/.konan
        key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
        restore-keys: konan-${{ runner.os }}-
